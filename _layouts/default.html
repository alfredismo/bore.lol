<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title | default: "bore.lol" }}</title>
<meta name="description" content="{{ site.description | default: 'memes, musica y diseno desde mexico' }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/terminal.css' | relative_url }}">
</head>
<body>

<div class="wrap">

  <header>
    <div class="prompt"><span class="user">bore@bore.lol</span>:<span class="path">~</span>$ <span class="cmd">./bore.exe</span></div>
    <h1><a href="{{ '/' | relative_url }}">BORE</a></h1>
  </header>

  <nav>
    <ul>
      <li><a href="{{ '/about/' | relative_url }}">about</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">blog</a></li>
      <li><a href="{{ '/music/' | relative_url }}">music</a></li>
      <li><a href="{{ '/design/' | relative_url }}">design</a></li>
      <li><a href="{{ site.meme_museum_url | default: 'https://alfredismo.github.io/memes/' }}">meme museum</a></li>
      <li><a class="ext" href="{{ site.x_url | default: 'https://x.com/' }}">x</a></li>
      <li><a class="ext" href="{{ site.instagram_url | default: 'https://instagram.com/' }}">instagram</a></li>
    </ul>
  </nav>

  <main>
    {{ content }}
  </main>

</div>

<footer>
  <span>bore.lol</span>
  <span><a href="#">↑ top</a></span>
</footer>

</body>
</html>
