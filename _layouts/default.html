<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title | default: "bore.lol" }}</title>
<meta name="description" content="{{ site.description | default: 'memes, musica y diseno desde mexico' }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&family=Bitcount+Single:CRSV,ELSH,ELXP,slnt,wght@0,0,0,0,400&family=Datatype:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/terminal.css' | relative_url }}">
{% if page.url == '/links/' %}
<style>
  body.links-route .wrap { width: min(100% - 32px, 900px); margin: 0 auto; padding-top: 14px; }
  body.links-route header { margin-bottom: 24px; }
  body.links-route header .prompt { display: none; }
  body.links-route header h1 { margin: 0; font-size: clamp(2.2rem, 9vw, 4.5rem); line-height: .9; }
  body.links-route nav { display: none; }
  body.links-route main { margin: 0; padding: 0; }
  body.links-route .links-only { padding-top: 0; }
  body.links-route footer { display: none; }
</style>
{% endif %}
</head>
<body class="{% if page.url == '/links/' %}links-route{% endif %}">
<div class="wrap">
<header>
  <div class="prompt"><span class="user">bore@bore.lol</span> <span class="cmd">://memes_thednaofthesoul.exe</span></div>
  <h1><a href="{{ '/' | relative_url }}">BORE</a></h1>
</header>
<nav>
<ul>
  <li><a href="{{ '/about/' | relative_url }}">about</a></li>
  <li><a href="{{ '/blog/' | relative_url }}">blog</a></li>
  <li><a href="{{ '/music/' | relative_url }}">dj chedraui</a></li>
  <li><a href="{{ '/design/' | relative_url }}">design</a></li>
  <li><a href="https://alfredismo.github.io/memes/">meme museum</a></li>
  <li><a href="https://x.com/boreuno">x</a></li>
  <li><a href="https://instagram.com/boreuno">instagram</a></li>
  <li><a href="{{ '/links/' | relative_url }}">links</a></li>
</ul>
</nav>
<main>{{ content }}</main>
</div>
<footer><span>bore.lol © 2026</span><span><a href="#">↑ top</a></span></footer>
<script>
(function () {
  var nav = document.querySelector('body:not(.links-route) nav');
  if (!nav) return;
  var threshold = 120;
  window.addEventListener('scroll', function () {
    document.body.classList.toggle('nav-compact', window.scrollY > threshold);
  }, { passive: true });
})();
</script>
</body>
</html>
